<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b12" />
<title>开场动画 · 生成式物理实验沙盒</title>
<style>
  :root{
    --bg:#050b12;
    --cyan:#63e2ff;
    --violet:#a78bfa;
    --amber:#ffd37a;
    --green:#6ee7b7;
    --rose:#fb7f92;
    --text:#eaf6fd;
    --text-2:#bcd3e2;
    --text-3:#7e97a8;
    --text-4:#58707f;
    --mono:"SF Mono","JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
    --sans:"Inter","HarmonyOS Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    cursor:default;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #bg{position:fixed;inset:0;background:
      radial-gradient(1150px 720px at 50% 40%, #0e2740 0%, #081827 48%, #050b12 100%);}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;}

  /* ---------- 质感层 ---------- */
  #grain{
    position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }
  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(60% 60% at 50% 46%, rgba(224,246,255,.92) 0%, rgba(150,225,255,.42) 42%, rgba(99,226,255,0) 78%);
    opacity:0;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 44%, rgba(0,0,0,0) 36%, rgba(0,0,0,.40) 76%, rgba(0,0,0,.74) 100%);
  }

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;}
  .corner{
    position:absolute;width:30px;height:30px;
    border-color:rgba(99,226,255,.34);border-style:solid;border-width:0;
    opacity:0;transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .corner.tl{left:26px;top:26px;border-left-width:1px;border-top-width:1px;transform:translate(-6px,-6px);}
  .corner.tr{right:26px;top:26px;border-right-width:1px;border-top-width:1px;transform:translate(6px,-6px);}
  .corner.bl{left:26px;bottom:26px;border-left-width:1px;border-bottom-width:1px;transform:translate(-6px,6px);}
  .corner.br{right:26px;bottom:26px;border-right-width:1px;border-bottom-width:1px;transform:translate(6px,6px);}
  body.is-hud .corner{opacity:1;transform:none;}

  #topbar{
    position:fixed;left:44px;right:44px;top:38px;display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--text-4);
    opacity:0;transition:opacity 1s ease .2s;pointer-events:none;
  }
  body.is-hud #topbar{opacity:1;}
  #topbar .left{display:flex;align-items:center;gap:10px;}
  #topbar .dot{
    width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px rgba(99,226,255,.9);
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

  /* ---------- 底部进度 ---------- */
  #foot{position:fixed;left:44px;right:44px;bottom:38px;opacity:0;transition:opacity 1s ease .2s;pointer-events:none;}
  body.is-hud #foot{opacity:1;}
  #track{position:relative;height:1px;background:rgba(120,190,222,.14);overflow:hidden;}
  #fill{
    position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);
    background:linear-gradient(90deg, rgba(99,226,255,0) 0%, rgba(99,226,255,.9) 18%, rgba(196,240,255,1) 100%);
    box-shadow:0 0 12px rgba(99,226,255,.7);
  }
  #footrow{
    display:flex;justify-content:space-between;align-items:center;margin-top:11px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--text-4);
  }
  #stage-txt{transition:opacity .7s ease;}
  body.is-final #stage-txt{opacity:.55;}

  /* ---------- 文字舞台 ---------- */
  #stage{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:0 6vw;pointer-events:none;z-index:3;
  }
  .kicker{
    margin:0 0 clamp(12px,2vh,22px);
    font-family:var(--mono);font-size:11px;letter-spacing:.66em;text-indent:.66em;
    color:rgba(99,226,255,.55);text-transform:uppercase;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1), letter-spacing 2.2s cubic-bezier(.2,.8,.2,1);
  }
  body.is-glyph .kicker, body.is-final .kicker{
    opacity:1;transform:none;letter-spacing:.30em;text-indent:.30em;color:rgba(120,220,255,.78);
  }
  body.is-prism .kicker{opacity:0;transform:translateY(-6px);transition-duration:.5s;}

  h1.title{
    margin:0;
    font-size:clamp(30px, 6.2vw, 92px);
    font-weight:700;
    letter-spacing:.06em;
    line-height:1.12;
    color:var(--text);
    opacity:0;
    text-shadow:0 0 40px rgba(99,226,255,.16), 0 0 96px rgba(99,226,255,.09);
  }
  /* 字形期由粒子承载文字，真实标题仅在 final 期与粒子点阵做交叉溶解 */
  body.is-final h1.title{
    opacity:1;
    animation:titleIn 1.15s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes titleIn{
    0%  {opacity:0; filter:blur(8px);  transform:scale(1.018);}
    55% {opacity:.92;}
    100%{opacity:1; filter:blur(0);    transform:none;}
  }

  #rule{
    width:min(420px,52vw);height:1px;margin:clamp(16px,2.6vh,26px) 0 0;
    background:linear-gradient(90deg, rgba(99,226,255,0), rgba(99,226,255,.85), rgba(167,139,250,.7), rgba(99,226,255,0));
    transform:scaleX(0);transform-origin:50% 50%;opacity:0;
    transition:transform 1.5s cubic-bezier(.16,1,.3,1), opacity .6s ease;
    box-shadow:0 0 18px rgba(99,226,255,.35);
  }
  body.is-glyph #rule, body.is-final #rule{transform:scaleX(1);opacity:1;}
  body.is-prism #rule{transform:scaleX(.2);opacity:0;transition-duration:.5s;}

  .sub{
    margin:clamp(18px,2.8vh,28px) 0 0;
    font-size:clamp(12px,1.28vw,15px);
    letter-spacing:.16em;color:var(--text-2);
    opacity:0;transform:translateY(12px);
    transition:opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .sub2{
    margin:9px 0 0;
    font-family:var(--mono);font-size:clamp(9.5px,.86vw,11px);
    letter-spacing:.3em;color:var(--text-4);
    opacity:0;transform:translateY(12px);
    transition:opacity 1.1s ease .15s, transform 1.1s cubic-bezier(.2,.8,.2,1) .15s;
  }
  body.is-final .sub{opacity:1;transform:none;}
  body.is-final .sub2{opacity:.9;transform:none;}

  #cta{
    margin-top:clamp(24px,4vh,40px);
    display:flex;align-items:center;gap:14px;
    opacity:0;visibility:hidden;transform:translateY(14px);
    transition:opacity 1s ease .35s, transform 1s cubic-bezier(.2,.8,.2,1) .35s;
    pointer-events:none;
  }
  body.is-final #cta{opacity:1;visibility:visible;transform:none;pointer-events:auto;}

  .btn{
    position:relative;display:inline-flex;align-items:center;gap:9px;
    padding:11px 20px;border-radius:100px;
    font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.1em;
    color:#dff6ff;background:rgba(99,226,255,.075);
    border:1px solid rgba(99,226,255,.28);
    cursor:pointer;text-decoration:none;
    transition:background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    backdrop-filter:blur(6px);
  }
  .btn:hover{
    background:rgba(99,226,255,.14);border-color:rgba(99,226,255,.55);
    box-shadow:0 10px 30px rgba(99,226,255,.22), 0 0 0 1px rgba(99,226,255,.16) inset;
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0) scale(.985);}
  .btn .ic{width:13px;height:13px;display:block;flex:none;}
  .btn .ic path{fill:currentColor;}

  /* 主按钮：进入沙盒，整场唯一的实心高亮 */
  .btn-primary{
    color:#04121b;
    background:linear-gradient(180deg,#a8f0ff 0%,#63e2ff 100%);
    border-color:rgba(196,246,255,.9);
    box-shadow:0 10px 34px rgba(99,226,255,.30), 0 0 0 1px rgba(255,255,255,.22) inset;
  }
  .btn-primary:hover{
    background:linear-gradient(180deg,#c6f7ff 0%,#7fe9ff 100%);
    border-color:#d8faff;
    box-shadow:0 14px 44px rgba(99,226,255,.46), 0 0 0 1px rgba(255,255,255,.34) inset;
    transform:translateY(-2px);
  }

  .hint{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--text-4);
  }
  .hint b{color:var(--text-3);font-weight:500;}
  .hint-line{
    margin:clamp(16px,2.2vh,22px) 0 0;
    opacity:0;transform:translateY(10px);
    transition:opacity 1s ease .55s, transform 1s cubic-bezier(.2,.8,.2,1) .55s;
  }
  body.is-final .hint-line{opacity:1;transform:none;}

  /* 物理公式浮标 —— 放在左侧空白区，避开色散光扇 */
  .formula{
    position:fixed;font-family:var(--mono);font-size:clamp(9.5px,.82vw,11.5px);
    letter-spacing:.06em;color:rgba(150,205,235,.5);
    opacity:0;transition:opacity 1.1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;z-index:2;white-space:nowrap;
  }
  .formula::after{
    content:"";position:absolute;right:-22px;top:50%;width:14px;height:1px;
    background:rgba(99,226,255,.42);
  }
  .f1{left:7vw;top:31%;transform:translateY(-50%) translateX(-10px);text-align:right;}
  .f2{left:7vw;top:63%;transform:translateY(-50%) translateX(-10px);text-align:right;}
  body.is-prism .f1{opacity:1;transform:translateY(-50%) translateX(0);}
  body.is-prism .f2{opacity:1;transform:translateY(-50%) translateX(0);transition-delay:.18s;}

  #skip{
    position:fixed;right:44px;bottom:76px;
    font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:rgba(126,151,168,.6);
    padding:8px 0;border:0;background:none;cursor:pointer;z-index:5;
    opacity:0;visibility:hidden;transition:opacity .8s ease;
  }
  body.is-hud #skip{opacity:1;visibility:visible;}
  body.is-final #skip{opacity:0;visibility:hidden;}

  @media (max-width:720px){
    #topbar{left:26px;right:26px;top:30px;font-size:8.5px;letter-spacing:.16em;}
    #topbar .right{display:none;}
    #stage{padding:0 8vw;}
    h1.title{letter-spacing:.02em;line-height:1.18;}
    .kicker{font-size:9.5px;letter-spacing:.42em;text-indent:.42em;}
    body.is-glyph .kicker, body.is-final .kicker{letter-spacing:.24em;text-indent:.24em;}
    .sub{letter-spacing:.08em;}
    .sub2{letter-spacing:.18em;}
    #cta{flex-direction:column;gap:12px;}
    #skip{bottom:70px;}
    #foot{left:26px;right:26px;bottom:30px;}
    .corner{width:22px;height:22px;}
    .corner.tl{left:16px;top:16px;} .corner.tr{right:16px;top:16px;}
    .corner.bl{left:16px;bottom:16px;} .corner.br{right:16px;bottom:16px;}
    .formula{display:none;}
    #skip{right:26px;bottom:64px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="stage">
    <p class="kicker">Physics&nbsp;·&nbsp;Laboratory</p>
    <h1 class="title">生成式物理实验沙盒</h1>
    <div id="rule"></div>
    <p class="sub">自然语言驱动的受约束实验生成</p>
    <p class="sub2">受约束生成&nbsp;&nbsp;·&nbsp;&nbsp;确定性求解</p>
    <div id="cta">
      <a class="btn btn-primary" id="enter" href="./index.html?skip-opening">
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 8h9.1L8.3 4.8l1.1-1.1L14 8l-4.6 4.3-1.1-1.1 3.2-3.2H2.4V8Z"/></svg>
        进入实验沙盒
      </a>
    </div>
    <p class="hint hint-line">按 <b>Enter</b> 进入</p>
  </div>

  <div class="formula f1">n(λ) = A + B/λ²</div>
  <div class="formula f2">a = g (sin θ − μ<sub>k</sub> cos θ)</div>

  <div id="hud">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>

  <div id="topbar">
    <div class="left"><span class="dot"></span><span>PHYSICS&nbsp;LAB&nbsp;/&nbsp;OPENING</span></div>
    <div class="right">受约束生成&nbsp;·&nbsp;确定性求解</div>
  </div>

  <button type="button" id="skip">点击跳过&nbsp;›</button>

  <div id="foot">
    <div id="track"><div id="fill"></div></div>
    <div id="footrow">
      <span id="stage-txt">INITIALISING&nbsp;SOLVER</span>
      <span id="pct">00%</span>
    </div>
  </div>

  <div id="flash"></div>
  <div id="grain"></div>
  <div id="vignette"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     0. 基础工具
     ============================================================ */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp  = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => {
    const t = clamp((x - e0) / (e1 - e0 || 1), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function hexA(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  const flashEl = document.getElementById('flash');
  const view = { x: 0, y: 0, tx: 0, ty: 0 };

  const cv  = document.getElementById('scene');
  const ctx = cv.getContext('2d', { alpha: true });
  const body = document.body;
  const $ = s => document.querySelector(s);

  /* ============================================================
     1. 时间轴
     ============================================================ */
  const T = {
    hud:    500,
    seed:   780,
    swirl:  1250,
    glyph:  3050,
    prism:  5850,
    settle: 7850,
    final:  9150,
    end:    10200
  };

  /* ?t=6500 冻结在某一刻（用于截帧检查） */
  const params = new URLSearchParams(location.search);
  const EMBEDDED = params.has('embedded') && window.parent !== window;
  const FROZEN = params.has('t');
  const FROZEN_T = FROZEN ? clamp(parseFloat(params.get('t')) || 0, 0, T.end + 4000) : 0;

  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     2. 粒子系统
     ============================================================ */
  const PALETTE = ['#63e2ff', '#7fe6ff', '#a5f3fc', '#a78bfa', '#c4b5fd', '#ffffff'];

  /* 连续光谱：用于 settle 期让字形按横向位置着色，
     而不是每个粒子各拿一个离散色 —— 那样会糊成彩虹噪点 */
  const SPECTRUM = [
    [255,138,150], [255,170,102], [255,222,128], [206,242,166],
    [110,231,183], [99,226,255], [127,166,255], [177,139,255]
  ];
  function spectral(u) {
    const x = clamp(u, 0, 1) * (SPECTRUM.length - 1);
    const i = Math.floor(x), f = x - i;
    const a = SPECTRUM[i], b = SPECTRUM[Math.min(i + 1, SPECTRUM.length - 1)];
    return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)];
  }
  /* 把光谱色按 t 比例往白里混：t=0 纯白，t=1 纯光谱。
     字形用低 t 保持"白光"质感，只留一丝色偏。 */
  function spectralWhite(u, t) {
    const c = spectral(u);
    return 'rgb(' + Math.round(lerp(255, c[0], t)) + ',' +
                    Math.round(lerp(255, c[1], t)) + ',' +
                    Math.round(lerp(255, c[2], t)) + ')';
  }

  const RAYS = [
    { c: '#ff8fa3', a: -14.0 },
    { c: '#ffb066', a:  -7.0 },
    { c: '#ffe08a', a:   0.0 },
    { c: '#8bf0c0', a:   7.0 },
    { c: '#5fe3ff', a:  14.0 },
    { c: '#7fa6ff', a:  21.0 },
    { c: '#b18bff', a:  28.0 }
  ];

  let W = 0, H = 0, DPR = 1;
  let P = [];
  const glyph = { pts: [], w: 900, h: 120, cx: 0, cy: 0 };

  function buildParticles() {
    const area = Math.max(1, W * H);
    const N = Math.round(clamp(area / 235, 1600, 5600));
    P = new Array(N);
    for (let i = 0; i < N; i++) {
      const s = Math.random();
      P[i] = {
        x: W / 2 + rnd(-30, 30),
        y: H / 2 + rnd(-30, 30),
        px: W / 2, py: H / 2,
        vx: 0, vy: 0,
        seed: s,
        size: 0.65 + Math.random() * 1.45,
        stiff: 0.55 + Math.random() * 0.9,
        ray: (i % 11 === 0) ? -1 : (i % 7),
        baseHex: PALETTE[i % PALETTE.length],
        hex: PALETTE[i % PALETTE.length],
        a: 0
      };
    }
  }

  /* ---------- 从 DOM 标题采样字形点阵 ---------- */
  function sampleTitle() {
    const h1 = document.querySelector('.title');
    if (!h1) return;
    const rect = h1.getBoundingClientRect();
    const cs = getComputedStyle(h1);
    const fs = parseFloat(cs.fontSize) || 64;
    const tracking = cs.letterSpacing === 'normal' ? 0 : (parseFloat(cs.letterSpacing) || 0);
    const text = (h1.textContent || '').trim().replace(/\s+/g, ' ');
    if (!text) return;

    const pad = Math.ceil(fs * 0.6);
    const bw = Math.max(8, Math.ceil(rect.width + pad * 2));
    const bh = Math.max(8, Math.ceil(rect.height + pad * 2));

    const off = document.createElement('canvas');
    off.width = bw; off.height = bh;
    const o = off.getContext('2d');
    o.fillStyle = '#fff';
    o.textBaseline = 'middle';
    o.textAlign = 'left';
    o.font = '700 ' + fs + 'px ' + cs.fontFamily;

    let total = 0;
    const chars = Array.from(text);
    for (const ch of chars) total += o.measureText(ch).width + tracking;
    total -= tracking;

    let x = (bw - total) / 2;
    const y = bh / 2;
    for (const ch of chars) {
      o.fillText(ch, x, y);
      x += o.measureText(ch).width + tracking;
    }

    const data = o.getImageData(0, 0, bw, bh).data;
    const step = fs > 80 ? 2 : (fs > 46 ? 2 : 3);
    const raw = [];
    for (let yy = 0; yy < bh; yy += step) {
      for (let xx = 0; xx < bw; xx += step) {
        if (data[(yy * bw + xx) * 4 + 3] > 140) {
          raw.push({ x: xx - bw / 2, y: yy - bh / 2 });
        }
      }
    }
    if (!raw.length) return;

    /* 打乱后按粒子数取点（不足则带抖动重复）。
       第二圈起的抖动必须极小，否则笔画会被撑胖、字看着"发毛" */
    for (let i = raw.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = raw[i]; raw[i] = raw[j]; raw[j] = t;
    }
    const n = Math.max(1, P.length);
    const pts = new Array(n);
    for (let i = 0; i < n; i++) {
      const p = raw[i % raw.length];
      const k = Math.floor(i / raw.length);
      pts[i] = k === 0 ? p : { x: p.x + rnd(-0.42, 0.42), y: p.y + rnd(-0.42, 0.42) };
    }

    glyph.pts = pts;
    glyph.w = rect.width;
    glyph.h = rect.height;
    glyph.cx = rect.left + rect.width / 2;
    glyph.cy = rect.top + rect.height / 2;
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    buildParticles();
    sampleTitle();
    if (FROZEN) frozenRender();
    else if (REDUCED) renderStill();
    else warmup();
  }

  /* 缩放后补几帧，避免首帧从"空盘"开始 */
  function warmup() {
    const t0 = performance.now() - startAt;
    for (let i = 0; i < 45; i++) step(t0, 16.7);
    render(t0);
  }

  /* ============================================================
     3. 场景几何（棱镜 / 色散）
     ============================================================ */
  function geom(clock) {
    const scale = clamp(Math.min(W, H) / 880, 0.6, 1.15);
    const side = 210 * scale;
    const pcx = W * 0.5 + view.x * 0.5;
    const pcy = H * 0.485 + view.y * 0.5;
    const rot = -0.14 + Math.sin(clock * 0.00035) * 0.022;
    const cr = Math.cos(rot), sr = Math.sin(rot);

    const base = [
      { x: 0, y: -0.62 * side },
      { x: 0.56 * side, y: 0.36 * side },
      { x: -0.56 * side, y: 0.36 * side }
    ];
    const tri = base.map(p => ({
      x: pcx + p.x * cr - p.y * sr,
      y: pcy + p.x * sr + p.y * cr
    }));

    const L = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    const entry = L(tri[0], tri[2], 0.62);
    const exit  = L(tri[0], tri[1], 0.50);

    const rays = RAYS.map(r => {
      const ang = r.a * Math.PI / 180;
      return { color: r.c, dx: Math.cos(ang), dy: Math.sin(ang), ang: ang };
    });

    return { tri, entry, exit, rays, pcx, pcy, side };
  }

  function phaseOf(clock) {
    if (clock < T.swirl) return 'void';
    if (clock < T.glyph) return 'swirl';
    if (clock < T.prism) return 'glyph';
    if (clock < T.settle) return 'prism';
    return 'settle';
  }

  /* ============================================================
     4. 物理步进
     ============================================================ */
  function step(clock, dt) {
    view.x += (view.tx - view.x) * 0.06;
    view.y += (view.ty - view.y) * 0.06;
    const g = geom(clock);
    const mode = phaseOf(clock);
    const s = clamp(dt / 16.667, 0.35, 2.4);
    const cx = (glyph.cx || W / 2) + view.x;
    const cy = (glyph.cy || H / 2) + view.y;
    const nPts = glyph.pts.length;

    const inPrism = mode === 'prism';
    const rayLen = Math.max(W, H) * 1.15;

    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.px = p.x;
      p.py = p.y;

      let tx, ty, k = 0.06, damp = 0.9, alpha = 1, hex = p.baseHex;

      /* 三臂螺旋星云：arm 定臂号，band 定沿臂位置，jit 给厚度 */
      if (mode === 'void' || mode === 'swirl') {
        const arm = i % 3;
        const band = (i * 0.6180339887) % 1;
        const jit = (p.seed - 0.5) * 2;                 /* -1..1 垂直散布 */
        const collapse = mode === 'void' ? Math.pow(1 - clamp(clock / T.swirl, 0, 1), 1.35) : 0;
        const spin = clock * 0.00056;
        const ang = arm * (TAU / 3) + band * 2.55 + spin + collapse * 1.3
                  + jit * 0.05;
        const rMax = Math.min(W, H) * 0.46;
        const r = (0.085 + band * 0.915) * rMax * (mode === 'void' ? (0.26 + 0.74 * collapse) : 1);
        const sway = Math.sin(clock * 0.0011 + band * 9) * rMax * 0.012;
        const thick = rMax * (0.016 + band * 0.052) * Math.abs(jit);
        const nx = Math.cos(ang) * 1.32, ny = Math.sin(ang) * 0.72;
        const ln = Math.hypot(nx, ny) || 1;
        /* 法向偏移 = 垂直于臂方向的厚度抖动 */
        const px = -ny / ln, py = nx / ln;
        tx = cx + nx * r + px * thick + sway;
        ty = cy + ny * r + py * thick;
        k = mode === 'void' ? 0.050 : 0.040;
        alpha = mode === 'void'
          ? (0.20 + 0.62 * clamp(clock / T.swirl, 0, 1))
          : (0.30 + 0.60 * (1 - band * 0.7));
        hex = band > 0.62 && p.seed > 0.55 ? '#ffffff' : p.baseHex;

      } else if (mode === 'glyph') {
        const pt = glyph.pts[i % nPts] || { x: 0, y: 0 };
        tx = cx + pt.x + Math.sin(clock * 0.0016 + p.seed * 13) * 0.9;
        ty = cy + pt.y + Math.cos(clock * 0.0013 + p.seed * 7) * 0.9;
        k = 0.105;

      } else if (inPrism) {
        /* 叙事：光自左扫过，把文字逐列"擦"掉 → 光穿过棱镜色散成谱。
           两类粒子：
             A 组（seed<0.5）留在字位，沿出射方向小幅外扩后淡出 —— 文字化光；
             B 组（seed>=0.5）直接出现在出射光线上，按弧长铺满整条射线。
           B 组不做弹簧飞行（那会横穿整屏拉出白雾），用"落位 + 淡入"。 */
        const gp = glyph.pts[i % nPts] || { x: 0, y: 0 };
        const sNorm = clamp(gp.x / Math.max(1, glyph.w * 0.5) * 0.5 + 0.5, 0, 1);

        /* 左→右列扫描，文字逐列被擦掉 */
        const delay = sNorm * 300;
        const morph = smoothstep(delay, delay + 300, clock - T.prism);

        const lit = smoothstep(T.prism + 180, T.prism + 900, clock);
        const r = p.ray < 0 ? null : g.rays[p.ray];
        const rayLen2 = Math.max(W, H) * 1.15;

        if (p.seed >= 0.5) {
          /* B 组：铺在色散射线上，按 seed 决定弧长 */
          const dir = r || g.rays[0];
          const q = ((p.seed - 0.5) / 0.5) * rayLen2;
          const jitter = (i % 17 - 8) * 0.42;
          const bx = g.exit.x + dir.dx * q - dir.dy * jitter;
          const by = g.exit.y + dir.dy * q + dir.dx * jitter;

          /* 落位后直接锁定，不走弹簧 */
          p.x = bx; p.y = by; p.px = bx; p.py = by;
          p.vx = 0; p.vy = 0;

          hex = r ? r.color : '#eafaff';
          const fadeOut = 1 - clamp(q / rayLen2, 0, 1);
          alpha = lit * (0.30 + 0.46 * fadeOut);
          /* 跳过后续弹簧积分 */
          p.a += (alpha - p.a) * Math.min(1, 0.16 * s);
          p.hex = hex;
          continue;
        }

        /* A 组：字位残影，小幅外扩后淡出 */
        const push = morph * (16 + p.seed * 40);
        const dxa = r ? r.dx : 0.6;
        const dya = r ? r.dy : -0.12;

        tx = cx + gp.x + dxa * push;
        ty = cy + gp.y + dya * push;
        k = 0.10;

        if (r) {
          hex = r.color;
          alpha = (0.26 * lit + 0.50) * (1 - morph);
        } else {
          hex = '#eafaff';
          alpha = 0.60 * (1 - morph);
        }
      } else {
        /* settle：色散光谱沿原路收回，重新凝成字形（近白、带横向光谱微染）；
           final 之后才向外漂散，并与真标题交叉溶解。 */
        const pt = glyph.pts[i % nPts] || { x: 0, y: 0 };
        const rx = clamp(pt.x / Math.max(1, glyph.w * 0.5) * 0.5 + 0.5, 0, 1);

        /* 收束（settle 开头 ~700ms） → 悬停 → 漂散（final 之后） */
        const settleIn = smoothstep(T.settle - 260, T.settle + 620, clock);
        const reveal = smoothstep(T.final + 60, T.final + 1250, clock);

        const ox = pt.x, oy = pt.y * 1.9;
        const ol = Math.hypot(ox, oy) || 1;
        const ang = p.seed * TAU * 0.14;
        /* 散得远一些，给标题留出干净的空洞（否则粒子糊在字上读不清） */
        const drift = reveal * (520 + p.seed * 620);

        tx = cx + pt.x + (ox / ol) * drift + Math.cos(ang) * drift * 0.22;
        ty = cy + pt.y + (oy / ol) * drift + Math.sin(ang) * drift * 0.18;

        if (p.ray < 0) {
          /* 少量粒子转成环绕尘埃，飘在远处，不压字 */
          const a2 = p.seed * TAU * 3.1 + clock * 0.00016 * (p.seed > 0.5 ? 1 : -1);
          tx = cx + Math.cos(a2) * (glyph.w * 1.05 + 300 + p.seed * 300);
          ty = cy + Math.sin(a2) * (glyph.h * 3.0 + 250 + p.seed * 240) * 0.56 - 30;
          k = 0.028;
          hex = spectralWhite(0.5 + p.seed * 0.4, 0.10);
          alpha = 0.10 + 0.16 * (1 - p.seed);
        } else {
          /* 收束期刚度更高，让字在 ~700ms 内成形而不是慢慢飘 */
          k = lerp(0.082, 0.055, settleIn);

          /* 字形主体是白光，横向两端才透出一点色散残留。
             tint 上限 0.26 —— 过了就不是"光凝成的字"，是彩虹噪点。
             色相走青→紫（跳过光谱红端），避免笔画泛品红显脏。 */
          const edge = smoothstep(0.34, 0.92, Math.abs(rx - 0.5) * 2);
          const tint = 0.05 + 0.21 * edge;
          hex = spectralWhite(0.34 + rx * 0.52, tint);

          const core = 1 - Math.abs(pt.y) / Math.max(1, glyph.h * 0.5); /* 笔画中部更亮 */
          const lit = 0.46 + 0.24 * clamp(core, 0, 1);

          /* 只有一部分粒子彻底消隐；其余降为缓慢星尘，让 final 帧不空 */
          const dust = p.seed > 0.34 ? 0.055 : 0;   /* 稳定后的星尘残光 */
          alpha = lit * (1 - reveal * (0.96 - dust)) + dust * reveal;
        }
      }

      p.vx += (tx - p.x) * k * p.stiff * s;
      p.vy += (ty - p.y) * k * p.stiff * s;
      const d = Math.pow(damp, s);
      p.vx *= d;
      p.vy *= d;

      /* 单帧位移封顶：掉帧时不会拉出丑陋的长拖线 */
      const maxStep = 13 * s;
      const sp2 = p.vx * p.vx + p.vy * p.vy;
      if (sp2 > maxStep * maxStep) {
        const inv = maxStep / Math.sqrt(sp2);
        p.vx *= inv; p.vy *= inv;
      }
      p.x += p.vx * s;
      p.y += p.vy * s;

      p.a += (alpha - p.a) * Math.min(1, 0.09 * s);
      p.hex = hex;
    }
  }

  /* ============================================================
     5. 渲染
     ============================================================ */
  function drawGlow(clock) {
    const m = Math.min(W, H);
    const t = clock * 0.00018;

    const g1 = ctx.createRadialGradient(
      W * 0.5 + Math.sin(t) * 46, H * 0.44 + Math.cos(t * 0.8) * 30, 0,
      W * 0.5 + Math.sin(t) * 46, H * 0.44 + Math.cos(t * 0.8) * 30, m * 0.78
    );
    g1.addColorStop(0, 'rgba(26,104,152,0.16)');
    g1.addColorStop(0.45, 'rgba(14,58,92,0.07)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    const g2 = ctx.createRadialGradient(W * 0.14, H * 0.86, 0, W * 0.14, H * 0.86, m * 0.62);
    g2.addColorStop(0, 'rgba(92,62,180,0.085)');
    g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, W, H);

    const g3 = ctx.createRadialGradient(W * 0.88, H * 0.16, 0, W * 0.88, H * 0.16, m * 0.55);
    g3.addColorStop(0, 'rgba(30,150,160,0.06)');
    g3.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g3;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGrid(clock) {
    const a = smoothstep(T.settle - 600, T.settle + 700, clock) * 0.9;
    if (a <= 0.001) return;

    const horizon = H * 0.74;
    const grad = ctx.createLinearGradient(0, horizon, 0, H);
    grad.addColorStop(0, hexA('#63e2ff', 0));
    grad.addColorStop(0.45, hexA('#63e2ff', 0.055 * a));
    grad.addColorStop(1, hexA('#8fd8ff', 0.16 * a));

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, horizon, W, H - horizon);
    ctx.clip();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;

    /* 纵向汇聚线 */
    ctx.beginPath();
    for (let i = -12; i <= 12; i++) {
      const xb = W / 2 + i * (W / 9);
      ctx.moveTo(xb, H + 20);
      ctx.lineTo(W / 2 + (xb - W / 2) * 0.10, horizon);
    }
    ctx.stroke();

    /* 横向透视线 */
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const p = i / 15;
      const y = horizon + Math.pow(p, 2.35) * (H - horizon) * 1.25;
      if (y > H + 10) continue;
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function prismAlpha(clock) {
    const inn = smoothstep(T.prism + 240, T.prism + 900, clock);
    /* 收束前就让棱镜淡出，避免三角形压在新聚成的字上 */
    const out = 1 - smoothstep(T.settle - 520, T.settle + 120, clock);
    return Math.min(inn, out);
  }

  function drawPrism(clock) {
    const a = prismAlpha(clock);
    if (a <= 0.002) return;

    const g = geom(clock);
    const tri = g.tri;

    /* 背后光雾 */
    const rg = ctx.createRadialGradient(g.pcx, g.pcy, 0, g.pcx, g.pcy, g.side * 2.1);
    rg.addColorStop(0, 'rgba(120,190,255,' + (0.10 * a) + ')');
    rg.addColorStop(0.5, 'rgba(140,120,250,' + (0.05 * a) + ')');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(g.pcx - g.side * 2.1, g.pcy - g.side * 2.1, g.side * 4.2, g.side * 4.2);

    /* 玻璃体 */
    ctx.beginPath();
    ctx.moveTo(tri[0].x, tri[0].y);
    ctx.lineTo(tri[1].x, tri[1].y);
    ctx.lineTo(tri[2].x, tri[2].y);
    ctx.closePath();
    const lg = ctx.createLinearGradient(tri[0].x, tri[0].y, tri[1].x, tri[1].y);
    lg.addColorStop(0, 'rgba(160,230,255,' + (0.13 * a) + ')');
    lg.addColorStop(0.55, 'rgba(120,170,255,' + (0.055 * a) + ')');
    lg.addColorStop(1, 'rgba(190,150,255,' + (0.10 * a) + ')');
    ctx.fillStyle = lg;
    ctx.fill();

    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(190,240,255,' + (0.5 * a) + ')';
    ctx.stroke();

    /* 高光棱边 */
    ctx.beginPath();
    ctx.moveTo(tri[0].x, tri[0].y);
    ctx.lineTo(tri[2].x, tri[2].y);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(255,255,255,' + ((0.22 + 0.16 * (0.5 + 0.5 * Math.sin(clock * 0.003))) * a) + ')';
    ctx.stroke();

    /* 入射光 */
    const beamA = smoothstep(T.prism - 520, T.prism + 120, clock);
    const bg2 = ctx.createLinearGradient(0, g.entry.y, g.entry.x, g.entry.y);
    bg2.addColorStop(0, 'rgba(220,245,255,0)');
    bg2.addColorStop(0.65, 'rgba(230,248,255,' + (0.22 * beamA) + ')');
    bg2.addColorStop(1, 'rgba(240,252,255,' + (0.62 * beamA) + ')');
    ctx.strokeStyle = bg2;
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(-40, g.entry.y);
    ctx.lineTo(g.entry.x, g.entry.y);
    ctx.stroke();

    /* 棱镜内部折射 */
    ctx.beginPath();
    ctx.moveTo(g.entry.x, g.entry.y);
    ctx.lineTo(g.exit.x, g.exit.y);
    ctx.strokeStyle = 'rgba(230,245,255,' + (0.38 * beamA) + ')';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    /* 出射色散光扇 */
    const L = Math.max(W, H) * 1.12;
    for (let i = 0; i < g.rays.length; i++) {
      const r = g.rays[i];
      const x2 = g.exit.x + r.dx * L;
      const y2 = g.exit.y + r.dy * L;
      const grd = ctx.createLinearGradient(g.exit.x, g.exit.y, x2, y2);
      grd.addColorStop(0, hexA(r.color, 0.55 * beamA));
      grd.addColorStop(0.30, hexA(r.color, 0.20 * beamA));
      grd.addColorStop(1, hexA(r.color, 0));
      ctx.strokeStyle = grd;

      ctx.lineWidth = 9;
      ctx.globalAlpha = 0.22 * a;
      ctx.beginPath(); ctx.moveTo(g.exit.x, g.exit.y); ctx.lineTo(x2, y2); ctx.stroke();

      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.moveTo(g.exit.x, g.exit.y); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 出射点光斑 */
    const wob = 0.5 + 0.5 * Math.sin(clock * 0.006);
    const sg = ctx.createRadialGradient(g.exit.x, g.exit.y, 0, g.exit.x, g.exit.y, 28 + wob * 8);
    sg.addColorStop(0, 'rgba(255,255,255,' + (0.5 * beamA) + ')');
    sg.addColorStop(1, 'rgba(160,230,255,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(g.exit.x, g.exit.y, 28 + wob * 8, 0, TAU);
    ctx.fill();
  }

  function drawParticles(clock) {
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (p.a <= 0.004) continue;

      const dx = p.x - p.px;
      const dy = p.y - p.py;
      const sp = dx * dx + dy * dy;

      ctx.globalAlpha = clamp(p.a, 0, 1);

      if (sp > 0.7) {
        ctx.strokeStyle = p.hex;
        ctx.lineWidth = p.size * 1.25;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      ctx.fillStyle = p.hex;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 0.92, 0, TAU);
      ctx.fill();

      if ((i & 3) === 0) {
        ctx.globalAlpha = clamp(p.a * 0.055, 0, 1);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 3.0, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawSeed(clock) {
    if (clock > 2700) return;
    const fadeIn = smoothstep(0, 420, clock);
    const fadeOut = 1 - smoothstep(1750, 2700, clock);
    const a = fadeIn * fadeOut;
    if (a <= 0.002) return;

    const x = W / 2, y = H / 2;
    const pulse = 0.5 + 0.5 * Math.sin(clock * 0.004);

    const rg = ctx.createRadialGradient(x, y, 0, x, y, 96);
    rg.addColorStop(0, 'rgba(235,252,255,' + (0.62 * a) + ')');
    rg.addColorStop(0.18, 'rgba(99,226,255,' + (0.26 * a) + ')');
    rg.addColorStop(1, 'rgba(99,226,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, 96, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,' + (0.92 * a) + ')';
    ctx.beginPath();
    ctx.arc(x, y, 1.2 + pulse * 1.1, 0, TAU);
    ctx.fill();

    for (let i = 0; i < 3; i++) {
      const ph = ((clock - 620 + i * 430) % 1290) / 1290;
      if (clock - 620 + i * 430 < 0) continue;
      const rr = 8 + ph * 190;
      ctx.strokeStyle = 'rgba(99,226,255,' + ((1 - ph) * 0.30 * a) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, rr, 0, TAU);
      ctx.stroke();
    }

    const w2 = 200 + 300 * smoothstep(640, 1500, clock);
    const bandA = (1 - smoothstep(1500, 2400, clock)) * a;
    if (bandA > 0.002) {
      const lg = ctx.createLinearGradient(x - w2, y, x + w2, y);
      lg.addColorStop(0, 'rgba(99,226,255,0)');
      lg.addColorStop(0.5, 'rgba(210,248,255,' + (0.55 * bandA) + ')');
      lg.addColorStop(1, 'rgba(99,226,255,0)');
      ctx.fillStyle = lg;
      ctx.fillRect(x - w2, y - 0.6, w2 * 2, 1.2);
    }
  }

  function render(clock) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    drawGlow(clock);

    ctx.globalCompositeOperation = 'source-over';
    drawGrid(clock);

    ctx.globalCompositeOperation = 'lighter';
    drawPrism(clock);
    drawParticles(clock);
    drawSeed(clock);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============================================================
     6. 文字 / HUD 时间轴
     ============================================================ */
  const stageTxt = document.getElementById('stage-txt');
  const pctEl = document.getElementById('pct');
  const fillEl = document.getElementById('fill');

  let timers = [];
  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  const STAGE_LABELS = [
    [0,          'INITIALISING SOLVER'],
    [T.swirl,    'SEEDING CONSTRAINTS'],
    [T.glyph,    'COMPOSING EXPERIMENT'],
    [T.prism,    'CAUCHY DISPERSION · n(λ)'],
    [T.settle,   'DETERMINISTIC SOLVER'],
    [T.final,    'READY']
  ];

  function setStageLabel(clock) {
    let label = STAGE_LABELS[0][1];
    for (const s of STAGE_LABELS) if (clock >= s[0]) label = s[1];
    if (stageTxt.textContent !== label) stageTxt.textContent = label;
  }

  function applyPhaseClasses(clock) {
    body.classList.toggle('is-hud',   clock >= T.hud);
    body.classList.toggle('is-glyph', clock >= T.glyph && clock < T.prism);
    body.classList.toggle('is-prism', clock >= T.prism && clock < T.settle);
    if (clock >= T.final) revealEntry();
  }

  function revealEntry() {
    const moveFocus = document.activeElement === skipBtn;
    body.classList.add('is-final');
    if (moveFocus) enterBtn.focus();
  }

  let startAt = performance.now();
  let pausedAt = 0;

  function start() {
    clearTimers();
    body.classList.remove('is-hud', 'is-glyph', 'is-prism', 'is-final');
    startAt = performance.now();
    pausedAt = 0;

    /* 重播时重新抖散粒子，避免完全重复 */
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.x = W / 2 + rnd(-26, 26);
      p.y = H / 2 + rnd(-26, 26);
      p.px = p.x; p.py = p.y;
      p.vx = 0; p.vy = 0;
      p.a = 0;
      p.seed = Math.random();
      p.ray = (i % 11 === 0) ? -1 : (i % 7);
    }

    at(T.hud,   () => body.classList.add('is-hud'));
    at(T.glyph, () => body.classList.add('is-glyph'));
    at(T.prism, () => {
      body.classList.remove('is-glyph'); body.classList.add('is-prism');
      pulse(0.20, 1200);
    });
    at(T.settle, () => pulse(0.30, 1400));
    at(T.final, () => {
      body.classList.remove('is-prism'); revealEntry();
      pulse(0.48, 1600);
    });
  }

  /* 一次柔和的曝光闪烁 */
  let flashRaf = 0;
  function pulse(strength, dur) {
    if (REDUCED) return;
    const t0 = performance.now();
    cancelAnimationFrame(flashRaf);
    const tick = () => {
      const p = clamp((performance.now() - t0) / dur, 0, 1);
      /* 快速上冲，缓慢衰减 */
      const v = p < 0.12 ? (p / 0.12) : Math.pow(1 - (p - 0.12) / 0.88, 2.1);
      flashEl.style.opacity = (v * strength).toFixed(4);
      if (p < 1) flashRaf = requestAnimationFrame(tick);
      else flashEl.style.opacity = '0';
    };
    flashRaf = requestAnimationFrame(tick);
  }

  function skipToEnd() {
    clearTimers();
    body.classList.remove('is-glyph', 'is-prism');
    body.classList.add('is-hud');
    revealEntry();
    startAt = performance.now() - T.final - 20;
    /* 让粒子直接落到终点构型 */
    for (let i = 0; i < 150; i++) step(T.final + 20, 16.7);
  }

  /* ============================================================
     7. 主循环
     ============================================================ */
  let last = performance.now();

  /* 冻结模式：预演到指定时刻后逐帧重绘（?t=毫秒，用于截帧核对） */
  function frozenRender() {
    for (let i = 0; i < 300; i++) step(FROZEN_T, 16.7);
    applyPhaseClasses(FROZEN_T);
    setStageLabel(FROZEN_T);
    const p = clamp(FROZEN_T / T.end, 0, 1);
    fillEl.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    pctEl.textContent = String(Math.round(p * 100)).padStart(2, '0') + '%';
    const loop = () => { render(FROZEN_T); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }

  function renderStill() {
    applyPhaseClasses(T.end);
    for (let i = 0; i < 150; i++) step(T.end, 16.7);
    render(T.end);
    setStageLabel(T.end);
    fillEl.style.transform = 'scaleX(1)';
    pctEl.textContent = '100%';
  }

  function frame(now) {
    const dt = clamp(now - last, 0, 32);
    last = now;

    const clock = now - startAt;
    step(clock, dt);
    render(clock);
    applyPhaseClasses(clock);
    setStageLabel(clock);

    const p = clamp(clock / T.end, 0, 1);
    fillEl.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    const pc = Math.round(p * 100);
    pctEl.textContent = (pc < 10 ? '0' : '') + pc + '%';

    requestAnimationFrame(frame);
  }

  /* ============================================================
     8. 交互
     ============================================================ */
  const enterBtn = document.getElementById('enter');
  const skipBtn = document.getElementById('skip');
  enterBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!EMBEDDED) return;
    e.preventDefault();
    window.parent.postMessage('physics-lab:enter', '*');
  });

  window.addEventListener('click', () => { if (!body.classList.contains('is-final')) skipToEnd(); });
  window.addEventListener('keydown', e => {
    const isFinal = body.classList.contains('is-final');
    if (e.key === 'Escape' && !isFinal) {
      skipToEnd();
    } else if (e.key === 'Enter' && isFinal && e.target !== enterBtn) {
      e.preventDefault();
      enterBtn.click();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      pausedAt = performance.now();
    } else if (pausedAt) {
      startAt += performance.now() - pausedAt;
      pausedAt = 0;
      last = performance.now();
    }
  });
  window.addEventListener('resize', () => { resize(); });
  window.addEventListener('pointermove', e => {
    if (REDUCED) return;
    view.tx = (e.clientX / Math.max(1, W) - 0.5) * -26;
    view.ty = (e.clientY / Math.max(1, H) - 0.5) * -18;
  }, { passive: true });
  window.addEventListener('pointerleave', () => { view.tx = 0; view.ty = 0; });

  /* ============================================================
     9. 启动
     ============================================================ */
  resize();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      sampleTitle();
      if (FROZEN) frozenRender();
      else if (REDUCED) renderStill();
    });
  }

  if (FROZEN) {
    /* 冻结模式：渲染单帧，禁掉过渡以便截帧核对 */
    const st = document.createElement('style');
    st.textContent = '*{transition:none !important;animation:none !important;}';
    document.head.appendChild(st);
    frozenRender();
  } else if (!REDUCED) {
    start();
    requestAnimationFrame(frame);
  }
  if (EMBEDDED) window.parent.postMessage('physics-lab:opening-ready', '*');
})();
</script>
</body>
</html>
